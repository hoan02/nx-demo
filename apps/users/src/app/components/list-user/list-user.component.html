<div class="container mx-auto p-4">
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-semibold text-gray-800">Users</h1>
    <button class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700" (click)="onAddUser()">
      + Add User
    </button>
  </div>

  <!-- Users Table -->
  <div class="overflow-x-auto">
    <table class="min-w-full table-auto border-collapse">
      <thead>
        <tr class="bg-gray-100 border-b text-left font-semibold text-gray-700">
          <th class="px-4 py-2">Username</th>
          <th class="px-4 py-2">Email</th>
          <th class="px-4 py-2">Role</th>
          <th class="px-4 py-2">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users" class="border-b hover:bg-gray-50">
          <td class="px-4 py-2 text-blue-600 hover:text-blue-800 cursor-pointer" (click)="onViewUser(user._id)">
            {{ user.username }}
          </td>
          <td class="px-4 py-2">
            {{ user.email }}
          </td>
          <td class="px-4 py-2 capitalize">
            {{ user.role }}
          </td>
          <td class="px-4 py-2">
            <button class="text-blue-600 hover:text-blue-800" (click)="onViewUser(user._id)">
              Edit
            </button>
            |
            <button class="text-red-600 hover:text-red-800" (click)="onDeleteUser(user._id)">
              Delete
            </button>
          </td>
        </tr>
        <tr *ngIf="users.length === 0">
          <td colspan="4" class="px-4 py-6 text-center text-gray-500 italic">
            No users available.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
